# Copia de seguridad semanal de los catálogos de clientes (Supabase).
# El repo es público: la copia se cifra con una clave antes de guardarse
# y solo se conserva 90 días como "artifact" de la ejecución (no entra en el repo).
#
# Secretos necesarios (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_DB_URL      Cadena de conexión "Session pooler" de Supabase (Connect → Session pooler),
#                        con tu contraseña de la base de datos puesta en lugar de [YOUR-PASSWORD].
#   RESPALDO_CLAVE       Una contraseña larga inventada por ti. Guárdala: sin ella no se puede abrir la copia.
#
# Para restaurar: descarga el artifact, descomprímelo y ejecuta
#   gpg --decrypt respaldo-catalogos.sql.gpg > respaldo.sql
# y pega respaldo.sql en el SQL Editor de Supabase.

name: Respaldo semanal de Supabase

on:
  schedule:
    - cron: "0 9 * * 1"   # lunes a las 9:00 UTC (5:00 en Caracas)
  workflow_dispatch:       # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Exportar y cifrar los datos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL}" ] || [ -z "${CLAVE}" ]; then
            echo "Faltan los secretos SUPABASE_DB_URL o RESPALDO_CLAVE." >&2; exit 1
          fi
          docker run --rm -e DB_URL="${DB_URL}" postgres:17 \
            pg_dump "${DB_URL}" --data-only --no-owner --no-privileges \
              -t public.negocios -t public.negocio_usuarios -t public.categorias \
              -t public.productos -t public.hoy \
            > respaldo-catalogos.sql
          test -s respaldo-catalogos.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "${CLAVE}" \
            --symmetric --cipher-algo AES256 -o respaldo-catalogos.sql.gpg respaldo-catalogos.sql
          rm respaldo-catalogos.sql
          ls -l respaldo-catalogos.sql.gpg

      - name: Guardar la copia (90 días)
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_number }}
          path: respaldo-catalogos.sql.gpg
          retention-days: 90
          if-no-files-found: error
